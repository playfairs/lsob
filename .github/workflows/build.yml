name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item src-tauri/target/release/lsob.exe release/lsob.exe
      - uses: actions/upload-artifact@v4
        with:
          name: lsob-windows
          path: release/lsob.exe

  macos:
    name: macOS installers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build -- --bundles app
      - name: Package installers
        run: |
          set -euo pipefail
          rm -rf release dmg-root
          mkdir -p release dmg-root
          find src-tauri/target/release/bundle -maxdepth 3 -print
          app_path=$(find src-tauri/target/release/bundle/macos -type d -name '*.app' -print -quit)
          test -n "$app_path"
          test -d "$app_path"
          xattr -cr "$app_path" || true
          ditto "$app_path" "dmg-root/$(basename "$app_path")"
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname l_SOB -srcfolder dmg-root -ov -format UDZO release/lsob.dmg
          pkgbuild --component "$app_path" --install-location /Applications release/lsob.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: lsob-macos
          path: |
            release/lsob.dmg
            release/lsob.pkg

  release:
    name: Attach release files
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lsob-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/lsob.exe
            release/lsob.dmg
            release/lsob.pkg
          generate_release_notes: true
